version: '3.8'

services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    shm_size: '1gb'
    environment:
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_PROVIDER=openai/google/gemini-flash-1.5
      - LLM_TEMPERATURE=0.3
    restart: always
